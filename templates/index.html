    }

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function buildApiUrl(path) {
        return path;
    }

    function describeHttpStatus(status) {
        const map = {
            400: '请求参数错误（400）',
            401: '未授权，请检查 API Key（401）',
            403: '访问被拒绝（403）',
            404: '接口地址不存在（404）',
            405: '请求方法不允许（405）',
            408: '请求超时（408）',
            415: '不支持的媒体类型（415）',
            429: '请求过于频繁（429）',
            500: '服务器内部错误（500）',
            502: '服务器网关错误（502）',
            503: '服务暂时不可用（503）',
            504: '请求超时（504）'
        };

        return map[status] || `请求失败，HTTP ${status} 错误`;
    }

    function extractReadableError(status, payload, rawText = '') {
        let detail = '';

        if (payload && typeof payload === 'object') {
            detail = payload.detail || payload.error || payload.reply || payload.message || '';
        } else if (typeof payload === 'string') {
            detail = payload;
        }

        if (typeof detail !== 'string') {
            detail = stringifyError(detail, '无法解析错误详情');
        }

        if (!detail && rawText) {
            detail = rawText.replace(/<[^>]*>/g, '').trim();
        }

        const summary = describeHttpStatus(status);
        return detail ? `${summary}：${detail}` : summary;
    }

    function stringifyError(error, fallback = '未知错误') {
        if (error === null || error === undefined) return fallback;
        if (typeof error === 'string') return error;
        if (error instanceof Error && error.message) return error.message;
        if (typeof error === 'object') {
            const detail = error.detail || error.error || error.message || error.raw;
            if (typeof detail === 'string' && detail.trim()) return detail;
            try {
                return JSON.stringify(error);
            } catch (_) {
                return fallback;
            }
        }
        return String(error);
    }

    function formatTime(value) {
        const date = new Date(value || Date.now());
        return date.toLocaleString('zh-CN', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function scrollToBottom() {
        chatWrap.scrollTop = chatWrap.scrollHeight;
    }

    function autoResizeTextarea(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function createTurnId() {
        return `turn-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function normalizeMessage(message) {
        if (!message || typeof message !== 'object') {
            return null;
        }

        const role = String(message.role || '').trim();
        const content = typeof message.content === 'string' ? message.content : String(message.content ?? '');
        if (!role || !content) {
            return null;
        }

        return {
            role,
            content,
            version: Number.isInteger(message.version) && message.version > 0 ? message.version : 1,
            ...(typeof message.turnId === 'string' && message.turnId.trim() ? { turnId: message.turnId.trim() } : {}),
            ...(message.excludeFromContext === true ? { excludeFromContext: true } : {}),
            ...(Array.isArray(message.citations) ? { citations: message.citations } : {}),
            ...(typeof message.imageBase64 === 'string' && message.imageBase64.startsWith('data:image/')
                ? { imageBase64: message.imageBase64 }
                : {}),
            ...(typeof message.imageId === 'string' && /^image_\d+$/.test(message.imageId)
                ? { imageId: message.imageId }
                : {})
        };
    }

    function getFirstUserMessageTitle(messages) {
        const firstUser = (messages || []).find((item) => item && item.role === 'user' && String(item.content || '').trim());
        if (!firstUser) {
            return '新对话';
        }

        const text = String(firstUser.content).trim();
        return text.slice(0, 15) || '新对话';
    }

    function createSession(overrides = {}) {
        const now = Date.now();
        const normalizedMessages = Array.isArray(overrides.messages)
            ? overrides.messages.map(normalizeMessage).filter(Boolean)
            : [];
        let currentTurnId = '';
        const messages = normalizedMessages.map((message, index) => {
            if (message.role === 'user') {
                currentTurnId = message.turnId || `turn-legacy-${index}`;
            }
            const turnId = message.turnId || currentTurnId || `turn-legacy-${index}`;
            return { ...message, turnId };
        });
        let imageIndex = 0;
        messages.forEach((message) => {
            if (message.role !== 'user' || !message.imageBase64) return;
            imageIndex += 1;
            message.imageId = `image_${imageIndex}`;
        });
        return {
            id: overrides.id || now.toString(),
            title: overrides.title || '新对话',
            messages,
            system_prompt: overrides.system_prompt || settings.system_prompt || DEFAULT_SYSTEM_PROMPT,
            temperature: typeof overrides.temperature === 'number'
                ? overrides.temperature
                : (Number.isFinite(Number(settings.temperature)) ? Number(settings.temperature) : 0.7),
            image_compress_ratio: Number.isFinite(Number(overrides.image_compress_ratio))
                ? Math.min(100, Math.max(10, Number(overrides.image_compress_ratio)))
                : (Number.isFinite(Number(settings.image_compress_ratio))
                    ? Math.min(100, Math.max(10, Number(settings.image_compress_ratio)))
                    : 50),
            model: overrides.model || settings.model || DEFAULT_MODEL,
            updatedAt: typeof overrides.updatedAt === 'number' ? overrides.updatedAt : now
        };
    }

    function loadSessionsFromStorage() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
                return [];
            }

            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) {
                return [];
            }

            return parsed.map(createSession).filter(Boolean);
        } catch (error) {
            console.warn('读取消息失败', error);
            return [];
        }
    }

    function saveSessionsToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
        } catch (error) {
            console.warn('Markdown 渲染失败，回退到纯文本', error);
            try {
                const lightweightSessions = sessions.map((session) => ({
                    ...session,
                    messages: (session.messages || []).map((message) => {
                        if (!message || typeof message !== 'object') return message;
                        const { imageBase64, ...messageWithoutImage } = message;
                        return imageBase64 ? messageWithoutImage : message;
                    })
                }));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(lightweightSessions));
            } catch (fallbackError) {
                console.warn('Markdown 渲染回退也失败', fallbackError);
            }
        }
    }

    function getCurrentSession() {
        return sessions.find((item) => item.id === currentSessionId) || null;
    }

    function sortSessionsByUpdatedAtDesc(list = sessions) {
        return [...list].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    function ensureAtLeastOneSession() {
        if (!sessions.length) {
            const session = createSession();
            sessions = [session];
            currentSessionId = session.id;
            saveSessionsToStorage();
            return session;
        }

        const existing = getCurrentSession();
        if (existing) {
            return existing;
        }

        sessions = sortSessionsByUpdatedAtDesc(sessions);
        currentSessionId = sessions[0].id;
        return sessions[0];
    }

    function syncSettingsFromSession(session) {
        if (!session) return;
        settings.model = session.model || DEFAULT_MODEL;
        settings.system_prompt = session.system_prompt || DEFAULT_SYSTEM_PROMPT;
        settings.temperature = typeof session.temperature === 'number' ? session.temperature : 0.7;
        settings.image_compress_ratio = Number.isFinite(Number(session.image_compress_ratio))
            ? Math.min(100, Math.max(10, Number(session.image_compress_ratio)))
            : 50;

        modelSelect.value = settings.model;
        systemPromptInput.value = settings.system_prompt;
        temperatureInput.value = String(settings.temperature);
        temperatureValue.textContent = Number(settings.temperature).toFixed(1);
        imageCompressRatio.value = String(settings.image_compress_ratio);
        imageCompressRatioValue.textContent = `${settings.image_compress_ratio}%`;
        updateContextUsage(session);
    }

    function syncSessionFromUI(session) {
        if (!session) return;
        session.model = modelSelect.value || DEFAULT_MODEL;
        session.system_prompt = systemPromptInput.value.trim() || DEFAULT_SYSTEM_PROMPT;
        session.temperature = Number(temperatureInput.value) || 0.7;
        session.image_compress_ratio = Math.min(100, Math.max(10, Number(imageCompressRatio.value) || 50));
        session.updatedAt = Date.now();
    }

    function updateCurrentSessionTitleFromMessages(session) {
        if (!session) return;
        session.title = getFirstUserMessageTitle(session.messages);
    }

    function getVersionLabel(version) {
        const numerals = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        const value = Number(version) || 1;
        if (value <= 1) return '';
        const label = value <= 10 ? numerals[value] : String(value);
        return `第${label}版`;
    }

    function addBubbleFooter(bubble, role, message) {
        if (role !== 'assistant') return;
        const versionLabel = getVersionLabel(message?.version);
        if (!versionLabel) return;

        const footer = document.createElement('div');
        footer.className = 'bubble-footer';
        const label = document.createElement('span');
        label.className = 'version-label';
        label.textContent = versionLabel;
        footer.appendChild(label);
        bubble.appendChild(footer);
    }

    function addBubbleActions(shell, role, content, message, messageIndex = -1, historyCount = 0) {
        if (role !== 'user' && role !== 'assistant') return;

        const actions = document.createElement('div');
        actions.className = 'bubble-actions-standalone';

        const copyButton = document.createElement('button');
        copyButton.type = 'button';
        copyButton.className = 'copy-btn';
        copyButton.dataset.copyText = content;
        copyButton.textContent = '📋 复制';
        copyButton.disabled = sending;
        actions.appendChild(copyButton);

        if (role === 'assistant') {
            const regenerateButton = document.createElement('button');
            regenerateButton.type = 'button';
            regenerateButton.className = 'regenerate-btn';
            regenerateButton.dataset.messageIndex = String(messageIndex);
            regenerateButton.textContent = '🔄 重新生成';
            actions.appendChild(regenerateButton);

            if (historyCount > 0 && message?.turnId) {
                const historyButton = document.createElement('button');
                historyButton.type = 'button';
                historyButton.className = 'history-versions-btn';
                historyButton.dataset.historyGroup = message.turnId;
                historyButton.textContent = `📜 展开历史 (${historyCount})`;
                actions.appendChild(historyButton);
            }
        }

        shell.appendChild(actions);
    }

    function openImageViewer(dataUrl) {
        if (!dataUrl) return;
        viewerImage.src = dataUrl;
        imageViewerModal.classList.add('show');
        imageViewerModal.setAttribute('aria-hidden', 'false');
    }

    function closeImageViewer() {
        imageViewerModal.classList.remove('show');
        imageViewerModal.setAttribute('aria-hidden', 'true');
        viewerImage.removeAttribute('src');
    }

    function renderBubble(role, content, appendToHistory = true, message = null, messageIndex = -1, renderOptions = {}) {
        if (emptyState.parentElement) {
            emptyState.remove();
        }

        const shell = document.createElement('div');
        shell.className = 'bubble-shell';
        if (renderOptions.collapsed) shell.classList.add('collapsed-versions');
        if (message?.turnId) shell.dataset.historyGroup = message.turnId;

        const bubble = document.createElement('div');
        bubble.className = `bubble ${role}`;
        if (messageIndex >= 0) bubble.dataset.messageIndex = String(messageIndex);
        const contentElement = document.createElement('div');
        contentElement.className = 'bubble-content';

        if (role === 'assistant') {
            contentElement.innerHTML = renderMarkdownContent(content);
            renderCitationTags(contentElement, message?.citations || []);
            renderImageCitationTags(contentElement);
            renderMath(contentElement);
            enhanceCodeBlocks(contentElement);
        } else {
            if (message?.imageBase64) {
                const imageLink = document.createElement('a');
                imageLink.className = 'message-image-link';
                imageLink.href = '#';
                imageLink.setAttribute('aria-label', '查看原始图片');
                imageLink.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    openImageViewer(message.imageBase64);
                });

                const image = document.createElement('img');
                image.className = 'message-image';
                image.src = message.imageBase64;
                image.alt = message.imageId || '用户上传图片';
                imageLink.appendChild(image);
                contentElement.appendChild(imageLink);
            }
            const textElement = document.createElement('div');
            textElement.textContent = content;
            contentElement.appendChild(textElement);
        }

        bubble.appendChild(contentElement);
        addBubbleFooter(bubble, role, message);
        shell.appendChild(bubble);
        addBubbleActions(shell, role, content, message, messageIndex, renderOptions.historyCount || 0);
        chatList.appendChild(shell);
        toggleEmptyState();
        scrollToBottom();

        if (appendToHistory) {
            const session = getCurrentSession();
            if (session) {
                session.messages.push({ role, content, version: 1, turnId: createTurnId() });
                session.updatedAt = Date.now();
                if (role === 'user' && session.title === '新对话') {
                    updateCurrentSessionTitleFromMessages(session);
                }
                historyMessages = session.messages;
                saveSessionsToStorage();
                renderHistoryList();
            }
        }

        return bubble;
    }

    function createAssistantBubble(message = null, messageIndex = -1, renderOptions = {}) {
        return renderBubble('assistant', '', false, message, messageIndex, renderOptions);
    }

    function updateAssistantBubble(bubble, content, citations = []) {
        if (!bubble) return;
        const contentElement = bubble.querySelector('.bubble-content');
        if (contentElement) {
            contentElement.innerHTML = renderMarkdownContent(content);
            renderCitationTags(contentElement, citations);
            renderImageCitationTags(contentElement);
            renderMath(contentElement);
            enhanceCodeBlocks(contentElement);
        }
        const copyButton = bubble.parentElement?.querySelector('.copy-btn');
        if (copyButton) copyButton.dataset.copyText = content;
        scrollToBottom();
    }

    function appendStoppedMarker(content) {
        const text = String(content || '').trimEnd();
        if (text.includes('[已停止生成]')) {
            return text;
        }
        return text ? `${text}\n\n*[已停止生成]*` : '*[已停止生成]*';
    }

    function persistAssistantMessage(session, assistantBubble, assistantText, stopped = false, userMessage = null, version = 1, citations = []) {
        const finalText = stopped ? appendStoppedMarker(assistantText) : String(assistantText || '');
        updateAssistantBubble(assistantBubble, finalText, citations);

        const assistantMessage = {
            role: 'assistant',
            content: finalText,
            version,
            turnId: userMessage?.turnId || createTurnId(),
            ...(stopped ? { excludeFromContext: true } : {}),
            ...(citations.length ? { citations } : {})
        };
        session.messages.push(assistantMessage);
        const assistantIndex = session.messages.length - 1;
        assistantBubble.dataset.messageIndex = String(assistantIndex);
        const regenerateButton = assistantBubble.parentElement?.querySelector('.regenerate-btn');
        if (regenerateButton) regenerateButton.dataset.messageIndex = String(assistantIndex);
        const versionLabel = assistantBubble.querySelector('.version-label');
        const versionText = getVersionLabel(version);
        if (versionText && !versionLabel) {
            const label = document.createElement('span');
            label.className = 'version-label';
            label.textContent = versionText;
            assistantBubble.querySelector('.bubble-footer')?.appendChild(label);
        }

        if (stopped && userMessage) {
            userMessage.excludeFromContext = true;
        }

        historyMessages = session.messages;
        session.system_prompt = systemPromptInput.value.trim() || session.system_prompt || DEFAULT_SYSTEM_PROMPT;
        session.temperature = Number(temperatureInput.value) || session.temperature || 0.7;
        session.model = modelSelect.value || session.model || DEFAULT_MODEL;
        session.updatedAt = Date.now();
        saveSessionsToStorage();
        renderHistoryList();
        renderMessages(session.messages);

        return finalText;
    }

    function toggleEmptyState() {
        if (historyMessages.length === 0) {
            if (!emptyState.parentElement) {
                chatList.appendChild(emptyState);
            }
            emptyState.style.display = 'block';
        } else if (emptyState.parentElement) {
            emptyState.remove();
        }
    }

    function clearChatUI() {
        chatList.innerHTML = '<div class="empty-state" id="emptyState">点击下方输入框开始对话。<br>页面会自动从 LM Studio 读取可用模型。</div>';
        emptyState = chatList.querySelector('#emptyState');
    }

    function getMessageRenderStates(messages) {
        const assistantGroups = new Map();
        messages.forEach((message, index) => {
            if (!message || message.role !== 'assistant' || !message.turnId) return;
            if (!assistantGroups.has(message.turnId)) assistantGroups.set(message.turnId, []);
            assistantGroups.get(message.turnId).push(index);
        });

        const states = new Map();
        assistantGroups.forEach((indices, turnId) => {
            if (indices.length < 2) return;
            const latestIndex = indices[indices.length - 1];
            indices.forEach((index) => {
                states.set(index, {
                    collapsed: index !== latestIndex,
                    historyCount: index === latestIndex ? indices.length - 1 : 0,
                    turnId
                });
            });
        });
        return states;
    }

    function renderMessages(messages) {
        clearChatUI();
        historyMessages = messages;

        if (!messages || !messages.length) {
            toggleEmptyState();
            return;
        }

        const renderStates = getMessageRenderStates(messages);
        messages.forEach((message, index) => {
            if (!message || !message.role) return;
            renderBubble(message.role, message.content, false, message, index, renderStates.get(index) || {});
        });

        toggleEmptyState();
        scrollToBottom();
    }

    function renderHistoryList() {
        const ordered = sortSessionsByUpdatedAtDesc(sessions);
        historyList.innerHTML = '';

        if (!ordered.length) {
            const empty = document.createElement('div');
            empty.className = 'history-empty';
            empty.textContent = '暂无历史会话，发送消息后自动保存';
            historyList.appendChild(empty);
            return;
        }

        ordered.forEach((session) => {
            const item = document.createElement('div');
            item.className = `history-item${session.id === currentSessionId ? ' active' : ''}`;
            item.innerHTML = `
                <div class="meta">
                    <div class="title">${escapeHtml(session.title || '新对话')}</div>
                    <div class="time">${escapeHtml(formatTime(session.updatedAt))}</div>
                </div>
                <button type="button" class="delete-btn">🗑️</button>
            `;

            item.addEventListener('click', () => {
                switchSession(session.id);
                closeHistoryDrawer();
            });

            const deleteBtn = item.querySelector('.delete-btn');
            deleteBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                deleteSession(session.id);
            });

            historyList.appendChild(item);
        });
    }

    function openHistoryDrawer() {
        renderHistoryList();
        historyDrawer.classList.add('show');
        historyDrawer.setAttribute('aria-hidden', 'false');
    }

    function closeHistoryDrawer() {
        historyDrawer.classList.remove('show');
        historyDrawer.setAttribute('aria-hidden', 'true');
    }

    function hideSettings() {
        settingsModal.classList.remove('show');
        settingsModal.setAttribute('aria-hidden', 'true');
    }

    function showSettings() {
        const session = getCurrentSession();
        if (session) {
            syncSettingsFromSession(session);
        }
        settingsModal.classList.add('show');
        settingsModal.setAttribute('aria-hidden', 'false');
    }

    function fillModels(models) {
        modelSelect.innerHTML = '';
        const uniqueModels = [];
        const seen = new Set();

        (models || []).forEach((item) => {
            const id = typeof item === 'string' ? item : item && item.id;
            if (id && !seen.has(id)) {
                seen.add(id);
                uniqueModels.push(id);
            }
        });

        if (!uniqueModels.length) {
            uniqueModels.push(DEFAULT_MODEL);
        }

        uniqueModels.forEach((id) => {
            const option = document.createElement('option');
            option.value = id;
            option.textContent = id;
            modelSelect.appendChild(option);
        });

        if (!seen.has(settings.model)) {
            settings.model = uniqueModels[0];
        }

        modelSelect.value = settings.model;
        modelsLoaded = true;
    }

    async function loadModels() {
        try {
            const response = await fetch(buildApiUrl('/api/models'), { method: 'GET' });
            const rawText = await response.text();
            let data = [];

            try {
                data = rawText ? JSON.parse(rawText) : [];
            } catch (_) {
                data = [];
            }

            if (!response.ok) {
                throw new Error(extractReadableError(response.status, data, rawText));
            }

            fillModels(Array.isArray(data) ? data : (data.data || []));
            const session = getCurrentSession();
            if (session) {
                modelSelect.value = session.model || settings.model;
            }
            await syncModelContextLimit(modelSelect.value);
        } catch (error) {
            console.error(error);
            fillModels([{ id: DEFAULT_MODEL }]);
            await syncModelContextLimit(modelSelect.value);
        }
    }

    async function syncModelContextLimit(modelId = modelSelect.value) {
        const session = getCurrentSession();
        if (!session) {
            updateContextUsage(session);
            return;
        }

        const selectedModel = String(modelId || session.model || DEFAULT_MODEL).trim();
        const useOverride = session.max_context_tokens_override === true || settings.max_context_tokens_override === true;

        if (useOverride) {
            const overrideLimit = normalizeMaxContextTokens(session.max_context_tokens ?? settings.max_context_tokens);
            session.max_context_tokens = overrideLimit;
            settings.max_context_tokens = overrideLimit;
            session.model = selectedModel;
            saveSessionsToStorage();
            saveSettingsToStorage();
            syncSettingsFromSession(session);
            updateContextUsage(session);
            return;
        }

        try {
            const response = await fetch(`${buildApiUrl('/api/model-info')}?model=${encodeURIComponent(selectedModel)}`);
            const data = await response.json();
            const modelLimit = normalizeMaxContextTokens(data?.context_length ?? data?.max_context_length);
            session.max_context_tokens = modelLimit;
            session.model = selectedModel;
            saveSessionsToStorage();
            syncSettingsFromSession(session);
        } catch (error) {
            console.warn('读取模型上下文上限失败，使用 8192', error);
            session.max_context_tokens = 8192;
            syncSettingsFromSession(session);
        }
        updateContextUsage(session);
    }

    function setSendingState(state) {
        sending = state;
        messageInput.disabled = state;
        imageUploadBtn.disabled = state;
        newChatBtn.disabled = state;
        settingsBtn.disabled = state;
        historyBtn.disabled = state;
        chatList.querySelectorAll('.copy-btn').forEach((copyButton) => {
            copyButton.disabled = state;
        });
        sendBtn.textContent = state ? '⏹️ 停止' : '发送';
        sendBtn.classList.toggle('stop-btn', state);
    }

    function appendLoadingBubble() {
        const bubble = document.createElement('div');
        bubble.className = 'bubble assistant';
        bubble.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
        bubble.dataset.loading = 'true';
        chatList.appendChild(bubble);
        toggleEmptyState();
        scrollToBottom();
        return bubble;
    }

    function removeLoadingBubble() {
        const loading = chatList.querySelector('[data-loading="true"]');
        if (loading) loading.remove();
    }

    function stopCurrentGeneration() {
        if (currentAbortController) {
            currentAbortController.abort();
        }
    }

    function persistCurrentSession() {
        const session = getCurrentSession();
        if (!session) return;
        syncSessionFromUI(session);
        session.messages = historyMessages;
        if (session.title === '新对话' || !session.title) {
            updateCurrentSessionTitleFromMessages(session);
        }
        session.updatedAt = Date.now();
        saveSessionsToStorage();
        renderHistoryList();
    }

    async function createAndSwitchToNewSession() {
        persistCurrentSession();
        const session = createSession({
            messages: [],
            system_prompt: systemPromptInput.value.trim() || DEFAULT_SYSTEM_PROMPT,
            temperature: Number(temperatureInput.value) || 0.7,
            model: modelSelect.value || settings.model || DEFAULT_MODEL,
            title: '新对话'
        });

        sessions.push(session);
        currentSessionId = session.id;
        historyMessages = session.messages;
        syncSettingsFromSession(session);
        renderMessages(session.messages);
        saveSessionsToStorage();
        renderHistoryList();
        await syncModelContextLimit(session.model);
        closeHistoryDrawer();
        messageInput.focus();
    }

    function switchSession(sessionId) {
        const session = sessions.find((item) => item.id === sessionId);
        if (!session || session.id === currentSessionId) return;

        persistCurrentSession();
        currentSessionId = session.id;
        historyMessages = session.messages;
        syncSettingsFromSession(session);
        renderMessages(session.messages);
        renderHistoryList();
        updateContextUsage(session);
        closeHistoryDrawer();
        messageInput.focus();
    }

    function deleteSession(sessionId) {
        if (!confirm('确定要删除这条历史记录吗？')) {
            return;
        }

        sessions = sessions.filter((item) => item.id !== sessionId);
        if (!sessions.length) {
            const session = createSession();
            sessions = [session];
            currentSessionId = session.id;
        } else if (currentSessionId === sessionId) {
            sessions = sortSessionsByUpdatedAtDesc(sessions);
            currentSessionId = sessions[0].id;
        } else {
            sessions = sortSessionsByUpdatedAtDesc(sessions);
        }

        const session = getCurrentSession();
        historyMessages = session ? session.messages : [];
        if (session) {
            syncSettingsFromSession(session);
        }
        renderMessages(historyMessages);
        saveSessionsToStorage();
        renderHistoryList();
        updateContextUsage(session);
    }

    function buildApiContext(messages, targetMsgIndex = null) {
        const session = getCurrentSession();
        const maxTokens = getContextLimit(session);
        const targetTokens = Math.max(256, Math.floor(maxTokens * 0.8));
        const systemMessage = {
            role: 'system',
            content: session?.system_prompt || systemPromptInput.value.trim() || DEFAULT_SYSTEM_PROMPT
        };
        const systemTokens = estimateTokens(systemMessage.content);
        const historyBudget = Math.max(1, targetTokens - systemTokens);
        const source = Number.isInteger(targetMsgIndex)
            ? messages.slice(0, targetMsgIndex)
            : messages;
        let validMessages = source
            .filter((message) => message
                && message.excludeFromContext !== true
                && (message.role === 'user' || message.role === 'assistant')
                && String(message.content || '').trim())
            .map((message) => ({ role: message.role, content: message.content }));

        const lastUserIndex = validMessages.reduce(
            (lastIndex, message, index) => message.role === 'user' ? index : lastIndex,
            -1
        );

        if (lastUserIndex < 0) {
            const fallbackUser = [...source]
                .reverse()
                .find((message) => message
                    && message.role === 'user'
                    && String(message.content || '').trim());
            if (fallbackUser) {
                validMessages = [{ role: 'user', content: fallbackUser.content }];
            }
        } else if (validMessages[validMessages.length - 1].role !== 'user') {
            validMessages = validMessages.slice(0, lastUserIndex + 1);
        }

        if (!validMessages.length || validMessages[validMessages.length - 1].role !== 'user') {
            throw new Error('未找到关联的用户问题，请重新发送');
        }

        const latestUser = validMessages[validMessages.length - 1];
        latestUser.content = truncateTextToTokenBudget(latestUser.content, historyBudget);
        const selected = [latestUser];
        let totalTokens = estimateTokens(latestUser.content);
        for (let index = validMessages.length - 2; index >= 0; index -= 1) {
            const message = validMessages[index];
            const messageTokens = estimateTokens(message.content);
            if (totalTokens + messageTokens > historyBudget) break;
            selected.unshift(message);
            totalTokens += messageTokens;
        }

        return selected;
    }

    async function requestAssistantResponse(session, assistantBubble, userMessage, version = 1, apiMessages = null, imageBase64 = null) {
        const loadingBubble = appendLoadingBubble();
        setSendingState(true);
        currentAbortController = new AbortController();
        let assistantText = '';
        let citations = [];

        try {
            const requestMessages = apiMessages || buildApiContext(session.messages);
            lastSentContextBySession.set(session.id, requestMessages);
            updateContextUsage(session, requestMessages);

            let finalSystemPrompt = systemPromptInput.value.trim() || session.system_prompt || DEFAULT_SYSTEM_PROMPT;
            const hasImages = session.messages.some((message) => message && message.imageId);
            if (hasImages) {
                finalSystemPrompt += '\n\n【注意】当回答涉及用户上传的图片时，请在引用或回答末尾标注对应的图片标识（例如 [image_1]、[image_2]）。';
            }

            const response = await fetch(buildApiUrl('/api/chat'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: currentAbortController.signal,
                body: JSON.stringify({
                    messages: requestMessages,
                    system_prompt: finalSystemPrompt,
                    temperature: Number(temperatureInput.value),
                    model: modelSelect.value || session.model || DEFAULT_MODEL,
                    web_search: isWebSearchEnabled,
                    image_base64: imageBase64
                })
            });

            if (!response.ok) {
                const rawText = await response.text();
                let data = {};
                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch (_) {
                    data = { raw: rawText };
                }
                throw new Error(extractReadableError(response.status, data, rawText));
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            removeLoadingBubble(loadingBubble);

            const consumeLines = (text) => {
                buffer += text;
                const lines = buffer.split(/\r?\n/);
                buffer = lines.pop() || '';
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || !trimmed.startsWith('data:')) continue;
                    const data = trimmed.slice(5).trim();
                    if (data === '[DONE]') continue;
                    let json;
                    try {
                        json = JSON.parse(data);
                    } catch (_) {
                        continue;
                    }
                    if (json?.error) {
                        throw new Error(stringifyError(json.detail || json.error, '模型返回错误'));
                    }
                    const delta = json?.choices?.[0]?.delta?.content;
                    if (Array.isArray(json?.citations)) {
                        citations = json.citations.filter((item) => item && typeof item === 'object');
                        updateAssistantBubble(assistantBubble, assistantText, citations);
                    }
                    if (typeof delta === 'string' && delta) {
                        assistantText += delta;
                        updateAssistantBubble(assistantBubble, assistantText, citations);
                    }
                }
            };

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                consumeLines(decoder.decode(value, { stream: true }));
            }
            consumeLines(decoder.decode());

            if (!assistantText.trim()) {
                assistantText = 'AI 未返回任何内容';
                updateAssistantBubble(assistantBubble, assistantText, citations);
            }
            persistAssistantMessage(session, assistantBubble, assistantText, false, userMessage, version, citations);
            updateContextUsage(session);
        } catch (error) {
            if (error && error.name === 'AbortError') {
                persistAssistantMessage(session, assistantBubble, assistantText || '', true, userMessage, version, citations);
            } else {
                console.error(error);
                removeLoadingBubble(loadingBubble);
                if (assistantBubble && assistantBubble.parentElement) assistantBubble.remove();
                renderBubble('system', `请求失败：${stringifyError(error)}`, false);
            }
        } finally {
            setSendingState(false);
            currentAbortController = null;
            updateContextUsage(session);
        }
    }

    async function regenerateResponse(messageIndex) {
        if (sending) return;
        const session = getCurrentSession();
        const oldMessage = session?.messages?.[messageIndex];
        if (!session || !oldMessage || oldMessage.role !== 'assistant') return;

        oldMessage.excludeFromContext = true;
        let apiMessages;
        try {
            apiMessages = buildApiContext(session.messages, messageIndex);
        } catch (error) {
            oldMessage.excludeFromContext = false;
            alert('未找到关联的用户问题，请重新发送');
            return;
        }

        const userMessage = [...session.messages.slice(0, messageIndex)]
            .reverse()
            .find((message) => message.role === 'user' && String(message.content || '').trim()) || null;
        const nextVersion = (Number(oldMessage.version) || 1) + 1;
        session.updatedAt = Date.now();
        saveSessionsToStorage();

        const assistantBubble = createAssistantBubble({ role: 'assistant', content: '', version: nextVersion });
        await requestAssistantResponse(
            session,
            assistantBubble,
            userMessage,
            nextVersion,
            apiMessages,
            userMessage.imageBase64 || null
        );
    }

    async function sendMessage() {
        if (sending) {
            stopCurrentGeneration();
            return;
        }

        const text = messageInput.value.trim();
        const imageBase64 = selectedImageBase64;
        if (!text && !imageBase64) return;
        const session = getCurrentSession();
        if (!session) return;

        const messageText = text || '（仅图片）';

        messageInput.value = '';
        autoResizeTextarea(messageInput);
        clearSelectedImage();
        const imageId = imageBase64
            ? `image_${session.messages.filter((message) => message.role === 'user' && message.imageBase64).length + 1}`
            : null;
        const userMessage = {
            role: 'user',
            content: messageText,
            version: 1,
            turnId: createTurnId(),
            ...(imageBase64 ? {
                imageBase64,
                imageId,
                imageWidth: selectedImageWidth,
                imageHeight: selectedImageHeight
            } : {})
        };
        session.messages.push(userMessage);
        historyMessages = session.messages;
        if (session.title === '新对话') updateCurrentSessionTitleFromMessages(session);
        session.updatedAt = Date.now();
        saveSessionsToStorage();
        renderHistoryList();
        updateContextUsage(session);
        renderBubble('user', messageText, false, userMessage, session.messages.length - 1);

        const assistantBubble = createAssistantBubble({ role: 'assistant', content: '', version: 1 });
        await requestAssistantResponse(
            session,
            assistantBubble,
            userMessage,
            1,
            buildApiContext(session.messages),
            imageBase64
        );
    }

    function cleanTextForClipboard(rawText) {
        let text = String(rawText ?? '').replace(/\r\n?/g, '\n');
        text = text.replace(/^(?:\s*(?:🔍|⚠️)[^\n]*(?:\n|$))+/, '');
        const subscriptMap = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
        const superscriptMap = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '+': '⁺', '-': '⁻', '=': '⁼', '(': '⁽', ')': '⁾' };
        const toSubscript = (value) => [...value].map((character) => subscriptMap[character] || character).join('');
        const toSuperscript = (value) => [...value].map((character) => superscriptMap[character] || character).join('');

        text = text
            .replace(/```[\w+-]*\s*\n?/g, '')
            .replace(/^\s{0,3}#{1,6}\s+/gm, '')
            .replace(/^(\s*)[*-]\s+/gm, '$1• ')
            .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
            .replace(/\*\*([^*\n]+)\*\*/g, '$1')
            .replace(/\*([^*\n]+)\*/g, '$1')
            .replace(/\$\$?|\\\[|\\\]|\\\(|\\\)/g, '');

        text = text
            .replace(/\\(iint|iiint|oint|int)_\{([^{}]+)\}\^\{([^{}]+)\}/g, (_, command, lower, upper) => `${({ iint: '∬', iiint: '∭', oint: '∮', int: '∫' })[command]}[${lower}→${upper}]`)
            .replace(/\\int_\{([^{}]+)\}\^\{([^{}]+)\}/g, '∫[$1→$2]')
            .replace(/\\int_([\w.-]+)\^([\w.-]+)/g, '∫[$1→$2]')
            .replace(/\\?xrightarrow(?:\[([^\]]*)\])?(?:\{([^{}]*)\})?/g, (_, optionalCondition, requiredCondition) => {
                const condition = String(requiredCondition || optionalCondition || '').trim();
                return condition ? `[${condition}]→` : '→';
            })
            .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '($1/$2)')
            .replace(/\\sqrt\{([^{}]+)\}/g, '√($1)')
            .replace(/\^\{([^{}]+)\}/g, (_, value) => toSuperscript(value))
            .replace(/\^([0-9]+[+-]?)/g, (_, value) => toSuperscript(value))
            .replace(/_\{([^{}]+)\}/g, (_, value) => toSubscript(value))
            .replace(/_([0-9]+)/g, (_, value) => toSubscript(value));

        const symbols = {
            longrightarrow: '→', rightarrow: '→', leftarrow: '←', uparrow: '↑', downarrow: '↓',
            pm: '±', approx: '≈', neq: '≠', le: '≤', ge: '≥', times: '×', div: '÷',
            alpha: 'α', beta: 'β', gamma: 'γ', pi: 'π', theta: 'θ', omega: 'ω', Delta: 'Δ', nabla: '∇',
            int: '∫', iint: '∬', iiint: '∭', oint: '∮', partial: '∂', infty: '∞', sum: '∑', cdot: '·'
        };
        Object.entries(symbols).forEach(([command, symbol]) => {
            text = text.replace(new RegExp(`\\\\${command}(?![A-Za-z])`, 'g'), symbol);
        });

        text = text
            .replace(/\b([A-Z][a-z]?)(\d+)(?=[A-Z]|$)/g, (_, element, count) => `${element}${toSubscript(count)}`)
            .replace(/\b([A-Z][a-z]?)(\d+)([+-])(?=\b|[^A-Za-z])/g, (_, element, charge, sign) => `${element}${toSuperscript(charge + sign)}`)
            .replace(/\\(?:left|right|text|mathrm|mathbf)\s*/g, '')
            .replace(/\\([A-Za-z]+)/g, '$1')
            .replace(/[{}]/g, '')
            .replace(/\s+\n/g, '\n')
            .replace(/\n{3,}/g, '\n\n');

        return text.trim();
    }

    async function copyText(text, button) {
        if (sending || button?.disabled) {
            return;
        }

        const cleanedText = cleanTextForClipboard(text);
        const restore = () => {
            button.textContent = '📋 复制';
        };

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(cleanedText);
            } else {
                throw new Error('clipboard unavailable');
            }
        } catch (_) {
            const textarea = document.createElement('textarea');
            textarea.value = cleanedText;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            const copied = document.execCommand('copy');
            textarea.remove();
            if (!copied) throw new Error('copy failed');
        }
        button.textContent = '✅ 已复制';
        window.setTimeout(restore, 1500);
    }

    function closeCitationPopover() {
        citationPopover.classList.remove('show');
        citationPopover.innerHTML = '';
    }

    function showCitationPopover(tag) {
        const messageIndex = Number(tag.closest('.bubble-shell')?.querySelector('.bubble')?.dataset.messageIndex);
        const message = Number.isInteger(messageIndex) ? historyMessages[messageIndex] : null;
        const citation = message?.citations?.find((item) => String(item?.id || '') === tag.dataset.id);
        if (!citation) return;

        citationPopover.innerHTML = '';
        const title = document.createElement('div');
        title.className = 'citation-title';
        title.textContent = `[${citation.id}] ${citation.title || '无标题'}`;
        if (citation.url) {
            const link = document.createElement('a');
            link.href = citation.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = citation.url;
            citationPopover.appendChild(link);
        }

        citationPopover.classList.add('show');
        const rect = tag.getBoundingClientRect();
        const left = Math.min(Math.max(12, rect.left), window.innerWidth - citationPopover.offsetWidth - 12);
        const top = Math.min(rect.bottom + 8, window.innerHeight - citationPopover.offsetHeight - 12);
        citationPopover.style.left = `${Math.max(12, left)}px`;
        citationPopover.style.top = `${Math.max(12, top)}px`;
    }

    function initializeSessions() {
        sessions = loadSessionsFromStorage();
        if (!sessions.length) {
            const session = createSession();
            sessions = [session];
            currentSessionId = session.id;
        } else {
            sessions = sessions.map(createSession);
            sessions = sortSessionsByUpdatedAtDesc(sessions);
            currentSessionId = sessions[0].id;
        }

        const session = getCurrentSession();
        historyMessages = session ? session.messages : [];
        syncSettingsFromSession(session || createSession());
        renderMessages(historyMessages);
        saveSessionsToStorage();
        renderHistoryList();
        updateContextUsage(session);
    }

    historyBtn.addEventListener('click', openHistoryDrawer);
    historyMask.addEventListener('click', closeHistoryDrawer);
    newChatBtn.addEventListener('click', createAndSwitchToNewSession);
    settingsBtn.addEventListener('click', showSettings);
    settingsMask.addEventListener('click', hideSettings);
    imageViewerMask.addEventListener('click', closeImageViewer);
    closeImageViewerBtn.addEventListener('click', closeImageViewer);
    closeSettingsBtn.addEventListener('click', hideSettings);
    webSearchToggle.addEventListener('click', toggleWebSearch);
    sendBtn.addEventListener('click', (event) => {
        event.preventDefault();
        sendMessage();
    });
    saveSettingsBtn.addEventListener('click', () => {
        const session = getCurrentSession();
        if (session) {
            syncSessionFromUI(session);
            settings.model = session.model;
            settings.system_prompt = session.system_prompt;
            settings.temperature = session.temperature;
            settings.image_compress_ratio = session.image_compress_ratio;
            syncSettingsFromSession(session);
            saveSessionsToStorage();
            renderHistoryList();
        }
        saveSettingsToStorage();
        hideSettings();
    });

    temperatureInput.addEventListener('input', () => {
        temperatureValue.textContent = Number(temperatureInput.value).toFixed(1);
    });
    imageCompressRatio.addEventListener('input', () => {
        imageCompressRatioValue.textContent = `${Number(imageCompressRatio.value) || 50}%`;
    });
    modelSelect.addEventListener('change', async () => {
        const session = getCurrentSession();
        if (!session) return;
        session.model = modelSelect.value || DEFAULT_MODEL;
        saveSessionsToStorage();
        await syncModelContextLimit(session.model);
    });

    messageInput.addEventListener('input', () => autoResizeTextarea(messageInput));
    imageUploadBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', () => {
        const [file] = imageInput.files || [];
        readImageFile(file);
    });
    messageInput.addEventListener('paste', (event) => {
        const imageItem = [...(event.clipboardData?.items || [])]
            .find((item) => item.type && item.type.startsWith('image/'));
        if (!imageItem) return;
        const file = imageItem.getAsFile();
        if (file) {
            event.preventDefault();
            readImageFile(file);
        }
    });
    messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            hideSettings();
            closeHistoryDrawer();
            closeCitationPopover();
            closeImageViewer();
            closeCodeRunner();
        }
    });

    codeRunnerMask.addEventListener('click', closeCodeRunner);
    closeCodeRunnerBtn.addEventListener('click', closeCodeRunner);

    document.addEventListener('click', (event) => {
        if (!event.target.closest('.citation-tag') && !event.target.closest('.citation-popover')) {
            closeCitationPopover();
        }
    });

    chatList.addEventListener('click', (event) => {
        const citationTag = event.target.closest('.citation-tag');
        if (citationTag) {
            event.stopPropagation();
            showCitationPopover(citationTag);
            return;
        }

        const codeCopyButton = event.target.closest('.code-copy-btn');
        if (codeCopyButton) {
            copyText(codeCopyButton.dataset.codeText || '', codeCopyButton).catch(() => {
                codeCopyButton.textContent = '❌ 复制失败';
            });
            return;
        }

        const codeRunButton = event.target.closest('.code-run-btn');
        if (codeRunButton) {
            openCodeRunner(codeRunButton.dataset.codeText || '', codeRunButton.dataset.codeLanguage || 'javascript');
            return;
        }

        const copyButton = event.target.closest('.copy-btn');
        if (copyButton) {
            if (sending || copyButton.disabled) {
                return;
            }
            copyText(copyButton.dataset.copyText || '', copyButton).catch(() => {
                copyButton.textContent = '❌ 复制失败';
                window.setTimeout(() => { copyButton.textContent = '📋 复制'; }, 1500);
            });
            return;
        }

        const regenerateButton = event.target.closest('.regenerate-btn');
        if (regenerateButton) {
            const messageIndex = Number(regenerateButton.dataset.messageIndex);
            if (Number.isInteger(messageIndex)) regenerateResponse(messageIndex);
            return;
        }

        const historyButton = event.target.closest('.history-versions-btn');
        if (historyButton) {
            const historyGroup = historyButton.dataset.historyGroup;
            const historyShells = [...chatList.querySelectorAll('.collapsed-versions')]
                .filter((shell) => shell.dataset.historyGroup === historyGroup);
            const shouldExpand = historyShells.some((shell) => shell.style.display !== 'flex');
            historyShells.forEach((shell) => {
                shell.style.display = shouldExpand ? 'flex' : 'none';
            });
            historyButton.textContent = shouldExpand ? '📕 收起历史' : `📜 展开历史 (${historyShells.length})`;
        }
    });

    chatList.addEventListener('keydown', (event) => {
        const citationTag = event.target.closest('.citation-tag');
        if (citationTag && (event.key === 'Enter' || event.key === ' ')) {
            event.preventDefault();
            showCitationPopover(citationTag);
        }
    });

    loadSettingsFromStorage();
    loadModels();
    loadWebSearchSetting();
    initializeSessions();
    autoResizeTextarea(messageInput);
</script>
