<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Local AI Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --bg: #0b1020;
            --panel: rgba(17, 24, 39, 0.92);
            --panel-soft: rgba(31, 41, 55, 0.92);
            --border: rgba(255, 255, 255, 0.08);
            --text: #e5e7eb;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --primary-2: #3b82f6;
            --user: #1d4ed8;
            --assistant: #111827;
            --danger: #f87171;
            --shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at top, #15213f 0%, var(--bg) 60%);
            color: var(--text);
            overflow: hidden;
        }

        button, input, textarea, select { font: inherit; }
        button {
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            padding: 12px 16px;
            box-shadow: 0 10px 24px rgba(59, 130, 246, 0.28);
        }
        button:disabled { opacity: .55; }

        .app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
            background: rgba(6, 10, 24, 0.9);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }

        .header .title {
            font-weight: 700;
            letter-spacing: .3px;
            text-align: center;
            flex: 1;
            font-size: 16px;
        }

        .header .left,
        .header .center,
        .header .right {
            width: auto;
            flex: 0 0 auto;
            display: flex;
            justify-content: flex-start;
        }
        .header .center { justify-content: center; }
        .header .right { justify-content: flex-end; }
        .header button {
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        .header .ghost {
            background: rgba(255,255,255,0.06);
            box-shadow: none;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: var(--text);
            white-space: nowrap;
        }

        .chat-wrap {
            flex: 1;
            overflow-y: auto;
            padding: calc(68px + env(safe-area-inset-top)) 12px calc(140px + env(safe-area-inset-bottom));
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
            padding: 32px 18px;
        }

        .bubble {
            max-width: min(86%, 680px);
            padding: 12px 14px;
            border-radius: 18px;
            line-height: 1.65;
            word-break: break-word;
            box-shadow: var(--shadow);
        }

        .bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .bubble.assistant {
            width: 100%;
            max-width: 100%;
            align-self: stretch;
            background: rgba(17, 24, 39, 0.95);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
        }

        .bubble.system {
            align-self: center;
            background: rgba(255,255,255,0.06);
            color: var(--muted);
            border: 1px dashed var(--border);
            box-shadow: none;
            font-size: 13px;
        }

        .bubble.assistant :is(p, ul, ol, blockquote, pre, h1, h2, h3, h4, h5, h6) {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .bubble.assistant pre {
            background: #0b1220;
            color: #e5e7eb;
            padding: 12px;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .code-block-shell {
            margin: 0 0 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0b1220;
        }
        .code-block-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 32px;
            padding: 5px 8px;
            background: rgba(255,255,255,.06);
            color: var(--muted);
            font-size: 11px;
        }
        .code-block-actions { display: flex; gap: 5px; }
        .code-block-actions button {
            padding: 3px 8px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 7px;
            background: rgba(255,255,255,.06);
            color: var(--muted);
            box-shadow: none;
            font-size: 11px;
            cursor: pointer;
        }
        .code-block-actions button:hover { color: var(--text); background: rgba(255,255,255,.12); }
        .code-block-shell pre {
            margin: 0;
            padding: 12px;
            border: 0;
            border-radius: 0;
        }
        .code-block-shell code {
            display: block;
            padding: 0;
            background: transparent;
        }
        .code-runner-modal {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: none;
        }
        .code-runner-modal.show { display: block; }
        .code-runner-modal .mask { position: absolute; inset: 0; background: rgba(0,0,0,.7); }
        .code-runner-sheet {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(94vw, 900px);
            height: min(82vh, 680px);
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: #0f172a;
            box-shadow: var(--shadow);
        }
        .code-runner-sheet iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; background: #fff; }
        .bubble.assistant code {
            background: rgba(255,255,255,0.06);
            padding: 2px 4px;
            border-radius: 6px;
        }
        .bubble.assistant em {
            color: var(--muted);
            font-style: italic;
        }

        .bubble-shell {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .bubble-content { min-width: 0; }
        .bubble-footer {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            margin-top: 8px;
            color: var(--muted);
        }
        .bubble-actions-standalone {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            min-height: 28px;
            margin-top: -2px;
            padding-right: 2px;
        }
        .bubble-actions-standalone button {
            padding: 4px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--muted);
            box-shadow: none;
            font-size: 12px;
            opacity: .72;
            cursor: pointer;
        }

        .message-image-link {
            display: block;
            width: fit-content;
            max-width: 100%;
            margin-bottom: 10px;
        }
        .message-image {
            display: block;
            width: min(220px, 100%);
            max-height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.14);
            cursor: zoom-in;
        }

        .image-viewer-modal {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: none;
        }
        .image-viewer-modal.show { display: flex; }
        .image-viewer-modal .mask {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .78);
        }
        .viewer-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 32px;
        }
        .viewer-content img {
            display: block;
            max-width:  min(94vw, 1400px);
            max-height: 90vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: var(--shadow);
            user-select: none;
        }
        .close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 2;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            background: rgba(15, 23, 42, .86);
            border: 1px solid rgba(255,255,255,.16);
            color: var(--text);
            box-shadow: none;
            cursor: pointer;
        }
        .image-citation-tag {
            display: inline-block;
            margin: 0 2px;
            padding: 1px 5px;
            border-radius: 5px;
            background: rgba(96, 165, 250, 0.18);
            color: var(--primary);
            font-size: .82em;
            text-decoration: none;
            cursor: pointer;
        }
        .image-citation-tag:hover { background: rgba(96, 165, 250, 0.32); }
        .bubble-actions-standalone button:hover {
            color: var(--text);
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.18);
            opacity: 1;
        }
        .bubble-footer .version-label {
            font-size: 12px;
            opacity: .72;
        }
        .collapsed-versions {
            display: none;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            background: rgba(6, 10, 24, 0.95);
            backdrop-filter: blur(18px);
            border-top: 1px solid var(--border);
        }

        .composer {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .composer-main {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .image-preview-bar {
            display: none;
            align-items: center;
            gap: 8px;
            min-height: 54px;
            margin-bottom: 8px;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
        }
        .image-preview-bar.show { display: flex; }

        .context-usage-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px 0;
            color: var(--muted);
            font-size: 12px;
        }
        .context-usage-track {
            flex: 1;
            height: 6px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255,255,255,.1);
        }
        .context-usage-progress {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: var(--primary);
            transition: width .2s ease, background-color .2s ease;
        }
        .context-usage-progress.warning { background: #facc15; }
        .context-usage-progress.danger { background: #f87171; }
        .context-usage-text { flex: 0 0 auto; white-space: nowrap; }
        .image-preview-item {
            position: relative;
            width: 44px;
            height: 44px;
        }
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .img-debug-badge {
            position: absolute;
            left: 50%;
            bottom: -22px;
            transform: translateX(-50%);
            width: max-content;
            max-width: 220px;
            padding: 2px 5px;
            border-radius: 5px;
            background: rgba(15, 23, 42, 0.88);
            color: var(--muted);
            font-size: 11px;
            line-height: 1.3;
            white-space: nowrap;
            pointer-events: none;
        }
        .image-preview-item:has(.img-debug-badge) { margin-bottom: 22px; }
        .image-remove-btn {
            position: absolute;
            top: -7px;
            right: -7px;
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 50%;
            background: #334155;
            color: #fff;
            box-shadow: none;
            font-size: 13px;
            line-height: 20px;
            cursor: pointer;
        }

        .composer-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .tool-btn {
            min-height: 34px;
            padding: 7px 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--muted);
            box-shadow: none;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }
        .tool-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }
        .tool-btn.active {
            background: rgba(59, 130, 246, 0.24);
            border-color: rgba(96, 165, 250, 0.7);
            color: #bfdbfe;
        }

        .image-upload-btn {
            flex: 0 0 auto;
            width: 40px;
            height: 48px;
            padding: 0;
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--muted);
            box-shadow: none;
            cursor: pointer;
        }
        .image-upload-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

        .composer textarea {
            width: 100%;
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 140px;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.06);
            color: var(--text);
            outline: none;
        }
        .composer textarea::placeholder { color: #94a3b8; }

        .send-btn {
            min-width: 84px;
            height: 48px;
            padding: 0 16px;
            border-radius: 16px;
        }

        .citation-tag {
            display: inline-block;
            margin: 0 1px;
            padding: 0 3px;
            border: 0;
            border-radius: 5px;
            background: rgba(96, 165, 250, 0.16);
            color: var(--primary);
            font-size: .78em;
            line-height: 1.4;
            cursor: pointer;
            vertical-align: baseline;
        }
        .citation-tag:hover { background: rgba(96, 165, 250, 0.3); color: #bfdbfe; }
        .citation-popover {
            position: fixed;
            z-index: 60;
            display: none;
            width: min(320px, calc(100vw - 24px));
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0f172a;
            box-shadow: var(--shadow);
            color: var(--text);
            font-size: 13px;
            line-height: 1.5;
        }
        .citation-popover.show { display: block; }
        .citation-popover .citation-title { font-weight: 700; margin-bottom: 6px; }
        .citation-popover a { color: var(--primary); overflow-wrap: anywhere; }

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .loading span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: pulse 1.1s infinite ease-in-out;
        }
        .loading span:nth-child(2) { animation-delay: .15s; }
        .loading span:nth-child(3) { animation-delay: .3s; }
        @keyframes pulse {
            0%, 80%, 100% { transform: translateY(0); opacity: .5; }
            40% { transform: translateY(-4px); opacity: 1; }
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: none;
        }
        .modal.show { display: block; }
        .modal .mask {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .52);
        }
        .modal .sheet {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 560px);
            max-height: 84vh;
            overflow: auto;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 18px;
        }
        .sheet h3 { margin: 0 0 16px; }
        .sheet .row { margin-bottom: 14px; }
        .sheet label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px;
        }
        .sheet select,
        .sheet textarea,
        .sheet input[type="range"] {
            width: 100%;
        }
        .sheet select,
        .sheet textarea {
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
            color: var(--text);
            padding: 12px 14px;
            outline: none;
        }
        .sheet textarea { min-height: 120px; resize: vertical; }
        .sheet .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        .sheet .actions .ghost-btn {
            background: rgba(255,255,255,0.06);
            box-shadow: none;
            cursor: pointer;
        }
        .range-line {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .range-value {
            min-width: 44px;
            text-align: right;
            color: var(--primary);
            font-weight: 700;
        }

        .drawer {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
        }
        .drawer.show { display: block; }
        .drawer .mask {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .52);
        }
        .drawer .panel {
            position: absolute;
            top: 0;
            left: 0;
            width: min(88vw, 360px);
            height: 100%;
            background: #0f172a;
            border-right: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        .drawer .panel h3 {
            margin: 0 0 12px;
        }
        .drawer .panel .history-list {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            box-shadow: none;
        }
        .history-item.active {
            border-color: rgba(96, 165, 250, 0.7);
            background: rgba(59, 130, 246, 0.16);
        }
        .history-item .meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }
        .history-item .meta .title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item .meta .time {
            font-size: 12px;
            color: var(--muted);
        }
        .history-item .delete-btn {
            flex: 0 0 auto;
            border-radius: 12px;
            padding: 8px 10px;
            background: rgba(248, 113, 113, 0.14);
            color: #fecaca;
            box-shadow: none;
        }
        .history-item .delete-btn:hover {
            background: rgba(248, 113, 113, 0.22);
        }
        .history-empty {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
            padding: 18px 8px;
        }

        @media (min-width: 800px) {
            .header .title { font-size: 18px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="left">
            <button id="historyBtn" class="ghost" type="button">📚 历史</button>
        </div>
        <div class="center">
            <button id="newChatBtn" class="ghost" type="button">➕ 新对话</button>
        </div>
        <div class="title">Local AI Assistant</div>
        <div class="right">
            <button id="settingsBtn" class="ghost" type="button">⚙️ 参数设置</button>
        </div>
    </header>

    <main class="chat-wrap" id="chatWrap">
        <div class="chat-list" id="chatList">
            <div class="empty-state" id="emptyState">
                点击下方输入框开始对话。<br>
                页面会自动从 LM Studio 读取可用模型。
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="composer">
            <button id="imageUploadBtn" class="image-upload-btn" type="button" title="上传图片" aria-label="上传图片">🖼️</button>
            <input id="imageInput" type="file" accept="image/*" hidden>
            <div class="composer-main">
                <div id="imagePreviewBar" class="image-preview-bar" aria-live="polite"></div>
                <div class="context-usage-bar">
                    <div class="context-usage-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                        <div id="contextUsageProgress" class="context-usage-progress"></div>
                    </div>
                    <div id="contextUsageText" class="context-usage-text">上下文用量: 0 / 8192 (0%)</div>
                </div>
                <textarea id="messageInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
            </div>
            <div class="composer-tools">
                <button id="webSearchToggle" class="tool-btn" type="button" aria-pressed="false">🔎 联网: 关</button>
            </div>
            <button id="sendBtn" class="send-btn" type="button">发送</button>
        </div>
    </footer>
</div>

<script>
    if (window.marked) {
        marked.setOptions({ breaks: true, gfm: true });
    }

    function renderMarkdownContent(content) {
        const source = String(content || '');
        if (!window.marked) {
            return `<pre>${escapeHtml(source)}</pre>`;
        }

        const formulas = [];
        const protectedSource = source.replace(
            /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|(?<!\\)\$(?!\$)(?:\\.|[^$\\\n])+(?<!\\)\$(?!\$))/g,
            (formula) => {
                const token = `KATEXFORMULA${formulas.length}PLACEHOLDER`;
                formulas.push(formula);
                return token;
            }
        );

        let html = marked.parse(protectedSource);
        formulas.forEach((formula, index) => {
            const token = `KATEXFORMULA${index}PLACEHOLDER`;
            html = html.split(token).join(escapeHtml(formula));
        });
        return html;
    }

    function normalizeCodeLanguage(className = '') {
        const match = String(className).match(/(?:language|lang)-([\w+-]+)/i);
        return (match ? match[1] : 'text').toLowerCase();
    }

    function escapeAttribute(value) {
        return escapeHtml(String(value || '')).replace(/`/g, '&#96;');
    }

    function enhanceCodeBlocks(element) {
        if (!element) return;
        element.querySelectorAll('pre').forEach((pre) => {
            if (pre.parentElement?.classList.contains('code-block-shell')) return;
            const code = pre.querySelector('code');
            if (!code) return;

            const language = normalizeCodeLanguage(code.className);
            if (window.hljs) {
                if (language !== 'text' && hljs.getLanguage(language)) {
                    code.classList.add(`language-${language}`);
                }
                hljs.highlightElement(code);
            }

            const shell = document.createElement('div');
            shell.className = 'code-block-shell';
            const toolbar = document.createElement('div');
            toolbar.className = 'code-block-toolbar';
            const label = document.createElement('span');
            label.textContent = language === 'text' ? '代码' : language.toUpperCase();
            toolbar.appendChild(label);

            const actions = document.createElement('div');
            actions.className = 'code-block-actions';
            const copyButton = document.createElement('button');
            copyButton.type = 'button';
            copyButton.className = 'code-copy-btn';
            copyButton.textContent = '📋 复制';
            copyButton.dataset.codeText = code.textContent || '';
            actions.appendChild(copyButton);

            if (['javascript', 'js', 'html', 'xml'].includes(language)) {
                const runButton = document.createElement('button');
                runButton.type = 'button';
                runButton.className = 'code-run-btn';
                runButton.textContent = '▶️ 运行';
                runButton.dataset.codeLanguage = language;
                runButton.dataset.codeText = code.textContent || '';
                actions.appendChild(runButton);
            }
            toolbar.appendChild(actions);
            shell.appendChild(toolbar);
            pre.replaceWith(shell);
            shell.appendChild(pre);
        });
    }

    function openCodeRunner(code, language) {
        const source = String(code || '');
        const doc = ['html', 'xml'].includes(language)
            ? source
            : `<!doctype html><html><body><scr${'ipt'}>${source.replace(/<\/script/gi, '<\\/script')}<\/script></body></html>`;
        codeRunnerFrame.srcdoc = doc;
        codeRunnerModal.classList.add('show');
        codeRunnerModal.setAttribute('aria-hidden', 'false');
    }

    function closeCodeRunner() {
        codeRunnerModal.classList.remove('show');
        codeRunnerModal.setAttribute('aria-hidden', 'true');
        codeRunnerFrame.srcdoc = '';
    }

    function renderCitationTags(element, citations = []) {
        if (!element || !Array.isArray(citations) || !citations.length) return;
        const citationIds = new Set(citations.map((item) => String(item?.id || '').trim()).filter(Boolean));
        if (!citationIds.size) return;

        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) {
            const node = walker.currentNode;
            if (node.parentElement && !node.parentElement.closest('pre, code, a')) textNodes.push(node);
        }

        textNodes.forEach((node) => {
            const source = node.nodeValue || '';
            const fragment = document.createDocumentFragment();
            let lastIndex = 0;
            const pattern = /\[(\d+)\]/g;
            let match;
            let changed = false;
            while ((match = pattern.exec(source)) !== null) {
                const id = match[1];
                if (!citationIds.has(id)) continue;
                changed = true;
                fragment.appendChild(document.createTextNode(source.slice(lastIndex, match.index)));
                const tag = document.createElement('sup');
                tag.className = 'citation-tag';
                tag.dataset.id = id;
                tag.textContent = `[${id}]`;
                tag.setAttribute('role', 'button');
                tag.setAttribute('tabindex', '0');
                tag.setAttribute('aria-label', `删除会话 ${id}`);
                fragment.appendChild(tag);
                lastIndex = match.index + match[0].length;
            }
            if (changed) {
                fragment.appendChild(document.createTextNode(source.slice(lastIndex)));
                node.parentNode.replaceChild(fragment, node);
            }
        });
    }

    function getSessionImageMap() {
        const map = new Map();
        const session = getCurrentSession();
        (session?.messages || []).forEach((message) => {
            if (message?.role === 'user' && message.imageId && message.imageBase64) {
                map.set(message.imageId, message.imageBase64);
            }
        });
        return map;
    }

    function renderImageCitationTags(element) {
        if (!element) return;
        const imageMap = getSessionImageMap();
        if (!imageMap.size) return;

        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) {
            const node = walker.currentNode;
            if (node.parentElement && !node.parentElement.closest('pre, code, a')) textNodes.push(node);
        }

        textNodes.forEach((node) => {
            const source = node.nodeValue || '';
            const fragment = document.createDocumentFragment();
            let lastIndex = 0;
            let changed = false;
            const pattern = /\[(image_\d+)\]/gi;
            let match;
            while ((match = pattern.exec(source)) !== null) {
                const imageId = match[1].toLowerCase();
                if (!imageMap.has(imageId)) continue;
                changed = true;
                fragment.appendChild(document.createTextNode(source.slice(lastIndex, match.index)));
                const tag = document.createElement('sup');
                tag.className = 'image-citation-tag';
                tag.dataset.imageId = imageId;
                tag.dataset.imageBase64 = imageMap.get(imageId);
                tag.textContent = `[${imageId}]`;
                tag.setAttribute('role', 'button');
                tag.setAttribute('tabindex', '0');
                tag.setAttribute('aria-label', `查看 ${imageId} 图片`);
                tag.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    openImageViewer(imageMap.get(imageId));
                });
                tag.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        event.stopPropagation();
                        openImageViewer(imageMap.get(imageId));
                    }
                });
                fragment.appendChild(tag);
                lastIndex = match.index + match[0].length;
            }
            if (changed) {
                fragment.appendChild(document.createTextNode(source.slice(lastIndex)));
                node.parentNode.replaceChild(fragment, node);
            }
        });
    }

    function renderMath(element) {
        if (!element || typeof window.renderMathInElement !== 'function') {
            return;
        }

        try {
            window.renderMathInElement(element, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '\\[', right: '\\]', display: true },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '$', right: '$', display: false }
                ],
                throwOnError: false,
                strict: 'ignore',
                ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            });
        } catch (error) {
            console.warn('LaTeX 渲染失败', error);
        }
    }

    function loadSettingsFromStorage() {
        try {
            const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
            if (!raw) return;

                settings.temperature = parsed.temperature;

            if (Number.isFinite(Number(parsed.image_compress_ratio))) {
                settings.image_compress_ratio = Math.min(100, Math.max(10, Number(parsed.image_compress_ratio)));
            }
        } catch (error) {

    function saveSettingsToStorage() {

                model: settings.model,

    function normalizeMaxContextTokens(value) {
        const number = Number(value);
        return Number.isFinite(number) ? Math.min(262144, Math.max(256, Math.round(number))) : 70000;
    }

    function estimateTokens(value) {
        if (Array.isArray(value)) {
            return Math.ceil(value.reduce((total, message) => {
                if (!message || typeof message !== 'object') return total;
                let tokens = estimateTokens(message.content);
                if (message.imageBase64 || message.imageId) {
                    tokens += calculateImageTokens(message.imageWidth, message.imageHeight);
                }
                return total + tokens;
            }, 0));
        }

        const text = String(value ?? '');
        let tokens = 0;
        let index = 0;
        while (index < text.length) {
            const character = text[index];
            if (/^[\u3400-\u9fff\u3000-\u303f\uff00-\uffef]$/.test(character)) {
                tokens += 1.5;
                index += 1;
                continue;
            }
            const word = text.slice(index).match(/^[A-Za-z0-9]+(?:['._-][A-Za-z0-9]+)*/);
            if (word) {
                tokens += Math.max(1, word[0].length / 4, word[0].split(/[-_.' ]+/).filter(Boolean).length * 1.3);
                index += word[0].length;
                continue;
            }
            if (/\s/.test(character)) {
                index += 1;
                continue;
            }
            tokens += 1;
            index += 1;
        }
        return Math.ceil(tokens);
    }

    function calculateImageTokens(width, height) {
        if (!width || !height) return 1024;
        let w = width, h = height;
        if (Math.max(w, h) > 2048) {
            const scale = 2048 / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
        }
        const minSide = Math.min(w, h);
        if (minSide > 768) {
            const scale = 768 / minSide;
            w = Math.round(w * scale);
            h = Math.round(h * scale);
        }
        const tilesW = Math.ceil(w / 512);
        const tilesH = Math.ceil(h / 512);
        return 85 + 170 * (tilesW * tilesH);
    }

    function getContextMessages(session) {
        if (!session) return [];
        const messages = (session.messages || [])
            .filter((message) => message && message.excludeFromContext !== true
                && (message.role === 'user' || message.role === 'assistant'));
        if (!messages.length) return [];
        return [{ role: 'system', content: session.system_prompt || DEFAULT_SYSTEM_PROMPT }].concat(messages);
    }

    function getContextLimit(session) {
        return normalizeMaxContextTokens(session?.max_context_tokens ?? settings.max_context_tokens);
    }

    function truncateTextToTokenBudget(text, tokenBudget) {
        const value = String(text || '');
        if (tokenBudget <= 0) return '';
        if (estimateTokens(value) <= tokenBudget) return value;
        let low = 0;
        let high = value.length;
        while (low < high) {
            const middle = Math.ceil((low + high) / 2);
            if (estimateTokens(value.slice(0, middle)) <= tokenBudget) low = middle;
            else high = middle - 1;
        }
        return value.slice(0, low).trimEnd() + '\n\n[当前消息过长，已按模型 Token 上限截断]';
    }

    function updateContextUsage(session = getCurrentSession(), contextMessages = null) {
        if (!contextUsageText || !contextUsageProgress) return;
        const maxTokens = getContextLimit(session);
        let actualMessages = contextMessages || lastSentContextBySession.get(session?.id);
        if (!actualMessages && session) {
            try {
                actualMessages = buildApiContext(session.messages);
            } catch (_) {
                actualMessages = [];
            }
        }
        const totalTokens = session
            ? estimateTokens([{ role: 'system', content: session.system_prompt || DEFAULT_SYSTEM_PROMPT }].concat(actualMessages || []))
            : 0;
        const percentage = maxTokens ? Math.min(100, Math.round((totalTokens / maxTokens) * 100)) : 0;
        contextUsageText.textContent = `上下文用量: ${totalTokens} / ${maxTokens} (${percentage}%)`;
        contextUsageProgress.style.width = `${percentage}%`;
        contextUsageProgress.classList.toggle('warning', percentage >= 60 && percentage <= 85);
        contextUsageProgress.classList.toggle('danger', percentage > 85);
        contextUsageTrack?.setAttribute('aria-valuenow', String(percentage));
        contextUsageTrack?.setAttribute('aria-valuetext', `${totalTokens} / ${maxTokens} Tokens`);
    }

    function getBase64Size(base64Str) {
        const byteSize = Math.round((String(base64Str || '').length * 3) / 4);
        if (byteSize >= 1024 * 1024) {
            return `${(byteSize / (1024 * 1024)).toFixed(2)} MB`;
        }
        return `${(byteSize / 1024).toFixed(1)} KB`;
    }

    function showImageDebugInfo(dataUrl, width, height) {

    function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.addEventListener('load', () => {
                if (typeof reader.result === 'string') {
                    resolve(reader.result);
                } else {
                    reject(new Error('图片读取失败'));
                }
            });
            reader.addEventListener('error', () => reject(reader.error || new Error('图片读取失败')));
            reader.readAsDataURL(file);
        });
    }

    function loadImage(dataUrl) {
        return new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error('图片加载失败'));
            image.src = dataUrl;
        });
    }

    async function compressImage(file, maxDimension = 768, quality = 0.7, compressionRatio = 50) {
        if (!file || !file.type || !file.type.startsWith('image/')) {
            throw new Error('请先选择有效的图片文件');
        }

        const source = await readFileAsDataUrl(file);
        const image = await loadImage(source);
        if (!image.naturalWidth || !image.naturalHeight) {
            throw new Error('无法读取图片尺寸');
        }

        const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
        const width = Math.max(1, Math.round(image.naturalWidth * scale));
        const height = Math.max(1, Math.round(image.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d', { alpha: false });
        if (!context) throw new Error('无法创建 Canvas 画布');

        context.fillStyle = '#fff';
        context.fillRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);

        let compressed = canvas.toDataURL('image/jpeg', quality);
        const ratio = Math.min(100, Math.max(10, Number(compressionRatio) || 50));
        const maxBytes = Math.round((150 + (2048 - 150) * (ratio / 100)) * 1024);
        let currentQuality = quality;
        while (compressed.length * 0.75 > maxBytes && currentQuality > 0.15) {
            currentQuality = Math.max(0.15, currentQuality - 0.1);
            compressed = canvas.toDataURL('image/jpeg', currentQuality);
        }

        return { dataUrl: compressed, width, height };
    }

    async function readImageFile(file) {
        if (!file) {
            clearSelectedImage();
            return;
        }
        if (!file.type || !file.type.startsWith('image/')) {
            clearSelectedImage();
            return;
        }

        const requestId = ++imageCompressionRequestId;
        imagePreviewBar.classList.add('show');
        imagePreviewBar.textContent = '已预览图片';
        try {
            const session = getCurrentSession();
            const ratio = Math.min(100, Math.max(10, Number(
                session?.image_compress_ratio ?? settings.image_compress_ratio ?? 50
            ) || 50));
            const maxDimension = Math.round(200 + (1920 - 200) * (ratio / 100));
            const quality = Math.max(0.15, (ratio / 100) * 0.95);
            const compressedImage = await compressImage(file, maxDimension, quality, ratio);
            if (requestId !== imageCompressionRequestId) return;
            selectedImageBase64 = compressedImage.dataUrl;
            selectedImageWidth = compressedImage.width;
            selectedImageHeight = compressedImage.height;
            showImagePreview(compressedImage.dataUrl, file.name);
            showImageDebugInfo(compressedImage.dataUrl, compressedImage.width, compressedImage.height);
        } catch (error) {
            if (requestId !== imageCompressionRequestId) return;
            console.warn('图片压缩失败', error);
            clearSelectedImage();
        }
    }
